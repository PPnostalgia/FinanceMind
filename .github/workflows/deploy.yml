name: Deploy Finance & Mind to GitHub Pages

on:
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout site code
        uses: actions/checkout@v4

      - name: Checkout Obsidian Vault
        uses: actions/checkout@v4
        with:
          repository: PPnostalgia/FinanceMindObsidianRepo
          path: vault
          token: ${{ secrets.VAULT_TOKEN }}

      - name: Sync vault content to Astro
        run: |
          mkdir -p src/content/wechat \
                   src/content/kb/economics \
                   src/content/kb/mental-models \
                   src/content/kb/science-tech \
                   src/content/kb/psychology
          # Wechat articles
          cp vault/01-Wechat/*.md src/content/wechat/ 2>/dev/null || echo "No wechat files"
          # Knowledge base
          for dir in economics mental-models science-tech psychology; do
            cp "vault/02-KnowledgeBase/$dir/"*.md "src/content/kb/$dir/" 2>/dev/null || echo "No files in $dir"
          done
          echo "Content synced:"
          find src/content -name "*.md" | sort

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
