name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ✅ 新增：同时 clone 你的 Vault 仓库
      - name: Checkout Obsidian Vault
        uses: actions/checkout@v7
        with:
          repository: PPnostalgia/FinanceMindObsidianRepo
          path: vault
          # 如果是私有仓库，需要配置 token（见下方说明）
          token: ${{ secrets.VAULT_TOKEN }}

      # ✅ 新增：把 Vault 公开内容复制到 content 目录
      - name: Sync vault content
        run: |
          rm -rf content
          mkdir content
          # 复制首页
          cp vault/index.md content/
          # 复制公众号文章
          cp -r vault/01-Wechat content/ 2>/dev/null || true
          # 复制知识库
          cp -r vault/02-KnowledgeBase content/ 2>/dev/null || true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz Plugins
        run: npx quartz plugin install --from-config

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
